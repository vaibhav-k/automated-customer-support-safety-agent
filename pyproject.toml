[project]
name = "automated-customer-support-safety-agent"
version = "1.0.0"
description = "AI-103 study project: Azure AI Foundry support agent with RAG, OpenAPI tooling, Content Safety and RBAC."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
# CLI error handlers log a one-line, actionable hint on purpose; a traceback would bury it.
"scripts/provision_agent.py" = ["TRY400"]

[tool.pyright]
# Picked up by Pylance (VS Code) and the pyright CLI.
include = ["orchestrator", "scripts", "src", "tests"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
pythonVersion = "3.11"

[tool.mypy]
exclude = ["^\\.venv/", "^build/", "^dist/"]

[[tool.mypy.overrides]]
# Optional dependency (requirements-eval.txt) without type information; absent in CI.
module = ["azure.ai.evaluation", "azure.ai.evaluation.*"]
ignore_missing_imports = true
